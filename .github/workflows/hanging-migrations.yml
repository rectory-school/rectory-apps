name: Check for hanging migrations
on:
  - pull_request

jobs:
  hanging_migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Check for hanging migrations
        run: uv run python manage.py makemigrations --dry-run --check
  
  